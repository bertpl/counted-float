[project]
name = "counted-float"
description = "Count floating-point operations in Python code & benchmark relative flop costs."
# readme is dynamic: hatch-fancy-pypi-readme builds the PyPI long-description from
# README.md, rewriting relative links to tag-pinned absolute URLs (config below).
# version is dynamic: hatch-vcs derives it from git at build time — a checkout of tag
# vX.Y.Z builds as exactly X.Y.Z, an untagged commit as the PEP 440 dev version
# X.Y.(Z+1).devN+g<sha> — so dev builds self-report their provenance (config below).
dynamic = ["readme", "version"]
requires-python = ">=3.11"
# Counting only. Everything the flops benchmark suite needs -- which is everything that describes or
# measures a machine -- sits behind the `benchmarking` extra instead, since counting numpy arrays is
# an explicit non-goal and the base install's audience is people doing arithmetic in plain Python.
dependencies = [
    # pydantic floor is a code requirement (auto model-rebuild of cross-module forward refs, from
    # 2.6; serialization `context` for the display-vs-stored key rendering, from 2.7), raised
    # further where a newer CPython needs a newer pydantic-core wheel.
    "pydantic>=2.7; python_version < '3.13'",
    "pydantic>=2.9; python_version == '3.13'",
    "pydantic>=2.12; python_version >= '3.14'",
    "rich>=13.0.0",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    # Python versions kept in sync with .python-versions (release.py enforces this)
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    # counting state is per-thread, so nothing is shared to race on a free-threaded build
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Topic :: Scientific/Engineering",
]

[project.scripts]
# the guard module (not the click CLI directly): base installs without the `cli` extra
# get an actionable message instead of a raw ModuleNotFoundError for `click`
counted_float = "counted_float._core._cli_main:main"

[project.urls]
Source = "https://github.com/bertpl/counted-float"
ChangeLog = "https://github.com/bertpl/counted-float/blob/main/CHANGELOG.md"
Issues = "https://github.com/bertpl/counted-float/issues"
Roadmap = "https://github.com/bertpl/counted-float/milestones"

[project.optional-dependencies]
# Everything the flops benchmark suite needs: the compiled probes, the arrays they run on, and the
# machine description stamped onto a result. Named for the capability rather than for its heaviest
# package, which is what the old `numba` name did.
benchmarking = [
    # per-Python floors: earliest numba with a wheel for that CPython (also fixes the
    # indirect llvmlite build failure — old numba>=0.50 dragged in unbuildable llvmlite 0.33)
    "numba>=0.57; python_version < '3.12'",
    "numba>=0.59; python_version == '3.12'",
    "numba>=0.61; python_version == '3.13'",
    "numba>=0.63; python_version >= '3.14'",
    # per-Python floors, same rationale: earliest release shipping a wheel for that CPython, so a
    # `lowest-direct` install resolves to a wheel rather than attempting a source build.
    "numpy>=1.23.2; python_version < '3.12'",
    "numpy>=1.26.0; python_version == '3.12'",
    "numpy>=2.1.0; python_version == '3.13'",
    "numpy>=2.3.2; python_version >= '3.14'",
    "psutil>=5.9.4; python_version < '3.13'",
    "psutil>=7.1.2; python_version >= '3.13'",
    "py-cpuinfo>=9.0.0",
]
# Deprecated alias for `benchmarking`, kept so no existing install string stops resolving. Drops at
# the next major; a self-referential extra is the standard way to spell "the same set as that one".
numba = [
    "counted-float[benchmarking]",
]
cli = [
    "click>=8.0.0",
]

[tool.uv]
# llvmlite dropped macOS x86_64 wheels from 0.46 (arm64-only since), so numba >= 0.63 is
# source-build-only on Intel Macs; cap it there so the numba extra resolves to the last
# version with wheels (0.62.x / llvmlite 0.45.x) instead of failing the install.  Scoped
# to < 3.14: Python 3.14 needs numba >= 0.63 (see the extra's floors), so Intel-Mac 3.14
# stays what it already is — a source build.
constraint-dependencies = [
    "llvmlite<0.46; sys_platform == 'darwin' and platform_machine == 'x86_64' and python_full_version < '3.14'",
]

[dependency-groups]
# Split by activity, so what each consumer needs is a stated fact rather than a shared pile. The
# test matrix installs no linters and no packaging tools, which matters beyond tidiness here: those
# tools brought `click` into every environment, so a leg installed *without* the cli extra still had
# click importable and could not exercise the guard that extra exists for.
test = [
    # floor raised off 6.0: older 6.x calls entry_points().get(), which importlib.metadata
    # removed in Python 3.14 (breaks the lowest-direct resolution there).
    "hypothesis>=6.156",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.5.0",
]
# ruff and ty run as local `uv run` hooks from .pre-commit-config.yaml rather than as pinned
# pre-commit environments, so both belong here alongside pre-commit itself. Exact versions are
# pinned by the tracked uv.lock; these ranges only set floors.
lint = [
    "pre-commit>=4.0",
    "ruff>=0.15.11",
    "ty>=0.0.56",
]
package = [
    "check-wheel-contents>=0.6.2",
]
# Union only -- never add a requirement here directly. `dev` is what a developer syncs and what the
# lint path installs, and it stays a derived fact so it cannot disagree with the groups above.
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "package" },
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]
# mutation testing (`make mutation`) — its own opt-in group, so the dev sync that
# `make lint` and CI run stays lean (mutmut drags in libcst / textual / setproctitle).
mutation = [
    "mutmut>=3.6.0",
]

[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
# image embeds (splash, ...): relative -> tag-pinned raw URL for PyPI
pattern = '\]\((images/[^)]+)\)'
replacement = '](https://raw.githubusercontent.com/bertpl/counted-float/v$HFPR_VERSION/\1)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
# the same, for images embedded as HTML rather than markdown. The theme-switching chart needs a
# `<picture>`, whose paths live in attributes and so are invisible to the markdown pattern above.
# PyPI's sanitiser drops `<picture>`/`<source>` and keeps the `<img>`, so PyPI shows the light
# variant -- which is what it should, having no dark mode -- but only if this URL is absolute.
pattern = '(src|srcset)="((?:docs/)?images/[^"]+)"'
replacement = '\1="https://raw.githubusercontent.com/bertpl/counted-float/v$HFPR_VERSION/\2"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
# docs/*.md references: relative -> tag-pinned blob URL for PyPI
pattern = '\]\((docs/[^)]+)\)'
replacement = '](https://github.com/bertpl/counted-float/blob/v$HFPR_VERSION/\1)'

[tool.hatch.build.targets.sdist]
# only-include preserves the src/ prefix verbatim (unlike `packages`, which rewrites
# paths and would leave the wheel build unable to locate the package in the sdist)
only-include = ["src/counted_float"]

[tool.hatch.build.targets.wheel]
packages = ["src/counted_float"]

[tool.ruff]
line-length = 120
target-version = "py311"  # matches requires-python floor, so ruff fixes never introduce newer syntax

[tool.ruff.lint]
select = [
    "F",       # pyflakes
    "E", "W",  # pycodestyle (incl. E501 line-too-long)
    "I",       # isort
    "UP",      # pyupgrade
    "B",       # flake8-bugbear
    "C4",      # flake8-comprehensions
    "PIE",     # flake8-pie
    "SIM",     # flake8-simplify
    "RET",     # flake8-return
    "N",       # pep8-naming
    "PTH",     # flake8-use-pathlib
    "PT",      # flake8-pytest-style
    "TC",      # flake8-type-checking
    "ANN",     # flake8-annotations
    "D",       # pydocstyle (Google convention; D401 enforced)
    "RUF",     # ruff-native
    "C901",    # mccabe complexity gate (threshold below)
    "PLE", "PLW",  # pylint errors + warnings (PLC/PLR excluded — noisy on this domain)
    "PGH",     # pygrep-hooks: no blanket `noqa` / `type: ignore`
    "BLE",     # flake8-blind-except
    "A",       # flake8-builtins: shadowing
    "RSE",     # flake8-raise: no needless parens on `raise`
    "FLY",     # flynt: static str-join → f-string
    "SLF",     # flake8-self: private-member access
    "INP",     # flake8-no-pep420: every package dir has an __init__.py
    "S",       # flake8-bandit: security lint
]
ignore = [
    "RUF001", "RUF002", "RUF003",  # intentional typography, not "ambiguous"
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-type-checking]
# Keep pydantic field types importable at runtime (pydantic evaluates
# annotations to build validators); don't move them under TYPE_CHECKING.
runtime-evaluated-base-classes = ["pydantic.BaseModel", "counted_float._core.models._base.JsonReprModel"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["SLF001", "S101", "S311", "D", "ANN"]  # AAA tests: asserts, private access, random data, no docstring/annotation duty
"__init__.py" = ["F401"]                 # re-export modules: naked imports, no `as` alias
# module-level mutable patching state (original-function snapshots + context refcount) is the design
"src/counted_float/_core/counting/_math_patching.py" = ["PLW0603"]
# maintainer tooling, not the shipped library: not a package (INP001), subprocess is fine (S)
"scripts/**" = ["INP001", "S"]
# docs example snippets, embedded verbatim into the docs: a docstring would pollute the example
"scripts/docs_snippets/*" = ["INP001", "D100"]
".github/scripts/**" = ["INP001", "S"]

[tool.ty.src]
include = ["src/counted_float"]

[tool.ty.rules]
# The numba shim needs `ty: ignore`s that are used only when the optional numba
# extra is absent from the env; flagging them as unused in the other env would
# make `ty check` results depend on which extras happen to be installed.
unused-ignore-comment = "ignore"
# Tightened beyond ty defaults: keep the py.typed surface fully parametrized (no bare
# generics), and require every `ty: ignore` to name the rule it suppresses.
missing-type-argument = "error"
blanket-ignore-comment = "error"

[tool.coverage.run]
source = ["counted_float"]
relative_files = true  # so per-combo matrix data files combine without a [paths] map
# no `parallel`: pytest-cov combines its own xdist workers into one file per run;
# each run/combo is named via COVERAGE_FILE, then combined across combos.

[tool.coverage.report]
precision = 2
fail_under = 100       # cumulative gate, enforced on the combined matrix data
exclude_also = [
    "@abstractmethod",
    "@abc.abstractmethod",
]

[tool.codespell]
# `sme`: "SME" (ARM's Scalable Matrix Extension) appears in the analysis docs.
# `intoto`: the in-toto attestation format (`provenance.intoto.jsonl`).
ignore-words-list = "sme,intoto"

[tool.pytest.ini_options]
addopts = "-n auto --dist worksteal"

[tool.mutmut]
# Local mutation testing via `make mutation` (never a CI gate; see the Makefile targets).
# source_paths must be the whole package: mutmut copies only source_paths (plus tests/) into its
# `mutants/` sandbox, so anything omitted becomes unimportable and test collection fails. The set of
# files actually mutated is scoped by only_mutate below.
source_paths = ["src/counted_float"]
# Everything under _core except the hardware-timed benchmark loops; the pure-Python benchmark ports
# are fast and tested, so they are in. (mutmut's globs match recursively, but the subfolders are
# listed explicitly so the intent survives a version whose globbing is literal.)
only_mutate = [
    "src/counted_float/_core/counting/*.py",
    "src/counted_float/_core/counting/config/*.py",
    "src/counted_float/_core/counting/verbosity/*.py",
    "src/counted_float/_core/compatibility/*.py",
    "src/counted_float/_core/models/*.py",
    "src/counted_float/_core/utils/*.py",
    "src/counted_float/_core/_cli.py",
    "src/counted_float/_core/_cli_main.py",
    "src/counted_float/_core/benchmarking/flops/_sumprod_port.py",
    "src/counted_float/_core/benchmarking/flops/_array_generator.py",
    "src/counted_float/_core/benchmarking/flops/_libm_bindings.py",
]
# Excluded from mutation -- every surviving mutant here is a false signal, not a real gap:
#   - _callsite.py is pure call-stack introspection, and mutmut runs tests through a trampoline that
#     becomes the reported call site, so no test can exercise it.
#   - _flop_weights_tree_view.py is a renderer whose meaningful behavior is covered elsewhere: the
#     plain-text layout byte-for-byte by the docs-drift test (which mutmut can't run -- it regenerates
#     via a subprocess), and the color styling + integer formatting (which the drift test strips /
#     never exercises) by tests/counting/test_flop_weights_tree_view.py. What remains is purely
#     cosmetic (color constants, column-packing widths) or equivalent (overwritten list inits, no-op
#     strict= on always-equal-length zips), so pinning it would add churn, not signal.
do_not_mutate = [
    "src/counted_float/_core/counting/verbosity/_callsite.py",
    "src/counted_float/_core/counting/_flop_weights_tree_view.py",
]
# -n 0 runs the suite serially (mutmut parallelizes across mutants itself); it overrides the
# addopts `-n auto` -- `-p no:xdist` would instead make `-n` unrecognized and pytest refuse to start.
# The --ignore/--deselect drop the tests that assert on the *real* call-site filename, which the
# trampoline reports as `trampoline.py` (they pass under a normal `make test`).
pytest_add_cli_args = [
    "-n", "0",
    "--ignore=tests/counting/verbosity/test_callsite.py",
    "--deselect=tests/counting/verbosity/test_flop_counts_with_logging.py::test_the_logged_line_reports_the_incrementing_location",
    "--deselect=tests/counting/verbosity/test_flop_counts_with_logging.py::test_lines_without_a_note_carry_no_rationale",
    "--deselect=tests/counting/verbosity/test_info_counting.py::test_logged_lines_locate_the_user_expression_not_the_library",
    "--deselect=tests/counting/verbosity/test_uncounted_warnings.py::test_each_call_site_is_reported_separately",
]
# Sandbox-safe unit tests only: tests/docs/ reads scripts/ and docs/ files mutmut does not copy in,
# and the slow real-benchmark tests under tests/benchmarking/ are excluded (only the fast port tests).
pytest_add_cli_args_test_selection = [
    "tests/counting",
    "tests/models",
    "tests/utils",
    "tests/shared",
    "tests/cli",
    "tests/benchmarking/flops/test_sumprod_port.py",
    "tests/benchmarking/flops/test_array_generator.py",
    "tests/benchmarking/flops/test_libm_bindings.py",
]
