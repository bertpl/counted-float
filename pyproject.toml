[project]
name = "counted-float"
version = "1.1.2"
description = "Count floating-point operations in Python code & benchmark relative flop costs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Per-Python floors: each compiled dep's floor is the earliest version shipping a
    # wheel for that CPython, so `lowest-direct` installs (not source-builds) everywhere.
    "numpy>=1.23.2; python_version < '3.12'",
    "numpy>=1.26.0; python_version == '3.12'",
    "numpy>=2.1.0; python_version == '3.13'",
    "numpy>=2.3.2; python_version >= '3.14'",
    # pydantic floor is a code requirement (auto model-rebuild of cross-module forward
    # refs, from 2.6), raised further where a newer CPython needs a newer pydantic-core wheel.
    "pydantic>=2.6; python_version < '3.13'",
    "pydantic>=2.9; python_version == '3.13'",
    "pydantic>=2.12; python_version >= '3.14'",
    "psutil>=5.9.4; python_version < '3.13'",
    "psutil>=7.1.2; python_version >= '3.13'",
    "rich>=13.0.0",
    "py-cpuinfo>=9.0.0",
]

[project.scripts]
counted_float = "counted_float._core._cli:cli"

[project.urls]
Source = "https://github.com/bertpl/counted-float"
ChangeLog = "https://github.com/bertpl/counted-float/blob/main/CHANGELOG.md"
Issues = "https://github.com/bertpl/counted-float/issues"
Roadmap = "https://github.com/bertpl/counted-float/milestones"

[project.optional-dependencies]
numba = [
    # per-Python floors: earliest numba with a wheel for that CPython (also fixes the
    # indirect llvmlite build failure — old numba>=0.50 dragged in unbuildable llvmlite 0.33)
    "numba>=0.57; python_version < '3.12'",
    "numba>=0.59; python_version == '3.12'",
    "numba>=0.61; python_version == '3.13'",
    "numba>=0.63; python_version >= '3.14'",
]
cli = [
    "click>=8.0.0",
]

[dependency-groups]
dev = [
    "genbadge[all]>=1.1.2",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.5.0",
    # exact tool versions are pinned by the tracked uv.lock (used by pre-commit,
    # `make lint`, and CI); these ranges just set the floor.
    "ruff>=0.15.11",
    "ty>=0.0.56",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# configs below also make sure the .whl file contains the data files, because wheels are built from the sdist
packages = ["counted_float"]
force-include = { "counted_float/data" = "counted_float/data" }

[tool.hatch.build.targets.wheel]
packages = ["counted_float"]

[tool.ruff]
line-length = 120
target-version = "py311"  # matches requires-python floor, so ruff fixes never introduce newer syntax

[tool.ruff.lint]
select = [
    "F",       # pyflakes
    "E", "W",  # pycodestyle (incl. E501 line-too-long)
    "I",       # isort
    "UP",      # pyupgrade
    "B",       # flake8-bugbear
    "C4",      # flake8-comprehensions
    "PIE",     # flake8-pie
    "SIM",     # flake8-simplify
    "RET",     # flake8-return
    "N",       # pep8-naming
    "PTH",     # flake8-use-pathlib
    "PT",      # flake8-pytest-style
    "TC",      # flake8-type-checking
    "ANN",     # flake8-annotations
    "D",       # pydocstyle (Google convention; D401 enforced)
    "RUF",     # ruff-native
    "C901",    # mccabe complexity gate (threshold below)
    "PLE", "PLW",  # pylint errors + warnings (PLC/PLR excluded — noisy on this domain)
    "PGH",     # pygrep-hooks: no blanket `noqa` / `type: ignore`
    "BLE",     # flake8-blind-except
    "A",       # flake8-builtins: shadowing
    "RSE",     # flake8-raise: no needless parens on `raise`
    "FLY",     # flynt: static str-join → f-string
    "SLF",     # flake8-self: private-member access
    "INP",     # flake8-no-pep420: every package dir has an __init__.py
    "S",       # flake8-bandit: security lint
]
ignore = [
    "RUF001", "RUF002", "RUF003",  # intentional typography, not "ambiguous"
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-type-checking]
# Keep pydantic field types importable at runtime (pydantic evaluates
# annotations to build validators); don't move them under TYPE_CHECKING.
runtime-evaluated-base-classes = ["pydantic.BaseModel", "counted_float._core.models._base.MyBaseModel"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["SLF001", "S101", "S311", "D", "ANN"]  # AAA tests: asserts, private access, random data, no docstring/annotation duty
"__init__.py" = ["F401"]                 # re-export modules: naked imports, no `as` alias
# module-level mutable patching state (original-function snapshots + context refcount) is the design
"counted_float/_core/counting/_math_patching.py" = ["PLW0603"]

[tool.ty.src]
include = ["counted_float"]

[tool.ty.rules]
# The numba shim needs `ty: ignore`s that are used only when the optional numba
# extra is absent from the env; flagging them as unused in the other env would
# make `ty check` results depend on which extras happen to be installed.
unused-ignore-comment = "ignore"

[tool.coverage.run]
source = ["counted_float"]

[tool.coverage.report]
exclude_also = [
    "@abstractmethod",
    "@abc.abstractmethod",
]

[tool.codespell]
# `sme`: "SME" (ARM's Scalable Matrix Extension) appears in the analysis docs.
ignore-words-list = "sme"

[tool.pytest.ini_options]
addopts = "-n auto --dist worksteal"
