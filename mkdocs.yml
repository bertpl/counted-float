site_name: counted-float
site_description: Count floating-point operations of numerical algorithms in plain Python, weighted by their relative cost.
site_url: https://counted-float.readthedocs.io/
repo_url: https://github.com/bertpl/counted-float
repo_name: bertpl/counted-float
edit_uri: ""

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.top
    - content.code.copy
    - toc.integrate

nav:
  - Home: index.md
  - Counting FLOPs: counting_flops.md
  - Math patching semantics: math_patching.md
  - The float surface: float_surface.md
  - FLOP weights: flop_weights.md
  - Benchmarking: benchmarking.md
  - CLI reference: cli.md
  - Known limitations: known_limitations.md
  - Deprecations: deprecations.md
  - Reference:
      - FLOP types: flop_types.md
      - Built-in data: builtin_data.md
      - Methodology: analysis_methodology.md
      - CPU architecture scope: cpu_architectures_scope.md
      - Cost model:
          - Principles and rules: cost_model_rules.md
          - Interpretations: cost_model_interpretations.md
          - Per-type pricing: cost_model_pricing.md
      - Benchmark machine code:
          - Overview: machine_code/index.md
          - ABS: machine_code/abs.md
          - ACOS: machine_code/acos.md
          - ACOSH: machine_code/acosh.md
          - ADD: machine_code/add.md
          - ASIN: machine_code/asin.md
          - ASINH: machine_code/asinh.md
          - ATAN: machine_code/atan.md
          - ATAN2: machine_code/atan2.md
          - ATANH: machine_code/atanh.md
          - CBRT: machine_code/cbrt.md
          - COMP: machine_code/comp.md
          - COPYSIGN: machine_code/copysign.md
          - COS: machine_code/cos.md
          - COSH: machine_code/cosh.md
          - DIST: machine_code/dist.md
          - DIST_XARG: machine_code/dist_xarg.md
          - DIV: machine_code/div.md
          - ERF: machine_code/erf.md
          - ERFC: machine_code/erfc.md
          - EXP: machine_code/exp.md
          - EXP2: machine_code/exp2.md
          - EXP10: machine_code/exp10.md
          - EXPM1: machine_code/expm1.md
          - FMA: machine_code/fma.md
          - FMOD: machine_code/fmod.md
          - GAMMA: machine_code/gamma.md
          - HYPOT: machine_code/hypot.md
          - HYPOT_XARG: machine_code/hypot_xarg.md
          - LGAMMA: machine_code/lgamma.md
          - LOG: machine_code/log.md
          - LOG1P: machine_code/log1p.md
          - LOG2: machine_code/log2.md
          - LOG10: machine_code/log10.md
          - MINUS: machine_code/minus.md
          - MUL: machine_code/mul.md
          - POW: machine_code/pow.md
          - REMAINDER: machine_code/remainder.md
          - RND: machine_code/rnd.md
          - SIN: machine_code/sin.md
          - SINH: machine_code/sinh.md
          - SQRT: machine_code/sqrt.md
          - SUB: machine_code/sub.md
          - SUMPROD: machine_code/sumprod.md
          - SUMPROD_XELEM: machine_code/sumprod_xelem.md
          - TAN: machine_code/tan.md
          - TANH: machine_code/tanh.md
      - Glossary: glossary.md
  - Changelog: changelog.md

plugins:
  - search

# Copies CHANGELOG.md into the site at build time, so the changelog page
# always mirrors the repo-root file without a tracked duplicate.
hooks:
  - scripts/docs_changelog_hook.py

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.details
  - pymdownx.superfences
  - tables

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/bertpl/counted-float
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/counted-float/
