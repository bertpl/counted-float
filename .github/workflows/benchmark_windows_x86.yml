name: benchmark_windows_x86.yml
on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
      - develop

jobs:
  run_benchmark:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run counted_float benchmark
        uses: ./.github/actions/benchmark
        with:
          uv_version: ${{ vars.UV_VERSION }}
