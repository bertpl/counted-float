name: Push to Main
on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/_unit_tests.yml

  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - uses: ./.github/actions/update_readme
        with:
          uv_version: ${{ vars.UV_VERSION }}
          github_token: ${{ secrets.GIT_ADMIN_TOKEN }}

  update-badges:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - uses: ./.github/actions/update_badges
        with:
          uv_version: ${{ vars.UV_VERSION }}
          github_token: ${{ secrets.GIT_ADMIN_TOKEN }}

  update-splash:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - uses: ./.github/actions/update_splash

  upload-version-artefacts:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    needs: [update-badges, update-splash]
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - uses: ./.github/actions/upload_version_artefacts
        id: deployment
        with:
          uv_version: ${{ vars.UV_VERSION }}
          github_token: ${{ secrets.GIT_ADMIN_TOKEN }}
