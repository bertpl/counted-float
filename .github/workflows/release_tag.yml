name: Release tag created
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate-tag-version:
    name: Validate tag name matches package version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          version: ${{ vars.UV_VERSION }}
          enable-cache: false

      - name: Validate tag and version match
        run: |
          PACKAGE_VERSION=$(uv version --short)
          TAG_NAME="${GITHUB_REF_NAME}"
          EXPECTED_TAG="v${PACKAGE_VERSION}"

          echo "Package version: ${PACKAGE_VERSION}"
          echo "Current tag: ${TAG_NAME}"
          echo "Expected tag: ${EXPECTED_TAG}"

          if [[ "${TAG_NAME}" != "${EXPECTED_TAG}" ]]; then
            echo "ERROR: Tag name does not match package version!"
            echo "  Tag: ${TAG_NAME}"
            echo "  Expected: ${EXPECTED_TAG}"
            exit 1
          else
            echo "✓ Tag name matches package version"
          fi

  publish-to-prod:
    needs: validate-tag-version
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      # IMPORTANT: this permission is mandatory for Trusted Publishing
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          version: ${{ vars.UV_VERSION }}
          enable-cache: false

      - name: Build package with uv
        shell: bash
        run: uv build

      - name: Publish package distributions to PyPI   [---PROD---]
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          repository-url: https://upload.pypi.org/legacy/
  # No bump-version job: release.py owns versioning (it bumps pyproject and opens
  # the next Unreleased section as part of the local release, before the tag push).
