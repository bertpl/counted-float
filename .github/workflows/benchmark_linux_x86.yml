name: benchmark_linux_x86.yml
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run_benchmark:
    # pinned rather than ubuntu-latest: this is the x86 half of an architecture pair, so it must
    # keep measuring x86 even if the default runner label moves to arm
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # full history + tags: hatch-vcs derives the package version via git describe
          fetch-depth: 0
          persist-credentials: false
      - name: Run counted_float benchmark
        uses: ./.github/actions/benchmark
        with:
          uv_version: ${{ vars.UV_VERSION }}
