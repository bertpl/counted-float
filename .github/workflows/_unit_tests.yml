name: Unit tests (full matrix)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  core:
    name: py${{ matrix.python }} / ${{ matrix.resolution }} / extras-${{ matrix.all_extras }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Core flop-counting is pure Python, so most combos run on ubuntu. But the CPU-freq
        # detection (psutil) and system-info collection (cpuinfo) paths are OS-dependent, and a
        # dependency bump can change their behavior on macOS or Windows -- so one leg on each keeps
        # those paths on the pull-request gate rather than only in the manual benchmark workflows.
        # Combos cover every axis (every supported Python, both resolution ends, extras on/off,
        # all three OSes) strategically rather than as a full product.
        #
        # The ubuntu legs run on arm runners, which are faster. One stays on x86: libm is found
        # through a lookup whose path is architecture-specific, and the FMA probes are checked
        # against emitted machine code -- both want a leg per architecture. It runs the default
        # Python, like the other single-purpose legs.
        include:
          - { os: ubuntu-24.04-arm, python: "3.12", resolution: highest,       all_extras: "true"  }
          - { os: ubuntu-24.04-arm, python: "3.13", resolution: highest,       all_extras: "true"  }
          - { os: ubuntu-latest,    python: "3.14", resolution: highest,       all_extras: "true"  }  # x86: see above
          - { os: ubuntu-24.04-arm, python: "3.12", resolution: lowest-direct, all_extras: "true"  }
          - { os: ubuntu-24.04-arm, python: "3.14", resolution: lowest-direct, all_extras: "true"  }
          - { os: ubuntu-24.04-arm, python: "3.12", resolution: highest,       all_extras: "false" }  # base install: no extras
          - { os: ubuntu-24.04-arm, python: "3.14", resolution: highest,       all_extras: "false" }  # base install: no extras
          # 3.15 is supported from its rc1: the interpreter is feature- and ABI-frozen there, so
          # validating against the rc validates the final release. Pinned to one exact build so
          # upstream breakage can only arrive in the commit that moves the pin; bump it as each
          # rc lands and at GA. Base install only, until numba ships 3.15 wheels.
          - { os: ubuntu-24.04-arm, python: "3.15.0rc1", resolution: highest,  all_extras: "false" }  # base install: no extras
          - { os: macos-latest,     python: "3.14", resolution: highest,       all_extras: "true"  }  # OS-dependent CPU paths
          - { os: windows-latest,   python: "3.14", resolution: highest,       all_extras: "true"  }  # OS-dependent CPU paths
          # Free-threaded build: counting state is per-thread, so this leg is where the
          # concurrency tests can actually fail for the reason they were written -- without the
          # GIL serializing the increments they guard. `highest` resolution is required: the
          # numba floor for 3.14 predates free-threaded wheels (first shipped in numba 0.65),
          # and no PEP 508 marker can raise that floor for free-threaded builds only.
          - { os: ubuntu-24.04-arm, python: "3.14t", resolution: highest,      all_extras: "true"  }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # full history + tags: hatch-vcs derives the package version via git describe
          fetch-depth: 0
          persist-credentials: false
      # uv never auto-downloads a pre-release for a bare version request, so a pre-release leg's
      # interpreter must be installed before the shared action can resolve it
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        if: contains(matrix.python, 'rc')
      - name: Install the pinned pre-release interpreter
        if: contains(matrix.python, 'rc')
        env:
          PYTHON_PRERELEASE: ${{ matrix.python }}
        run: uv python install "$PYTHON_PRERELEASE"
      - uses: ./.github/actions/unit_test
        with:
          python_version: ${{ matrix.python }}
          dependency_resolution: ${{ matrix.resolution }}
          include_all_extra_deps: ${{ matrix.all_extras }}
          coverage: "true"  # each combo uploads its data; the coverage job unions + gates

  coverage:
    name: coverage
    # Cumulative gate: combine every combo's data into one picture before
    # checking the floor, so version-/dependency-divergent code paths (only hit
    # on some combos) don't read as uncovered.
    needs: [core]
    # always() so a cancelled/failed combo makes this job FAIL explicitly rather
    # than skip — GitHub doesn't reliably propagate a cancelled leg through needs.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every matrix combo to have succeeded
        if: needs.core.result != 'success'
        run: |
          echo "::error::test matrix did not fully succeed (core: ${{ needs.core.result }})"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # full history + tags: hatch-vcs derives the package version via git describe
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Download coverage data from all matrix combos
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-data-*
          merge-multiple: true
      - name: Combine and report (fails below the [tool.coverage.report] floor)
        run: |
          uv run --no-default-groups --group test coverage combine
          uv run --no-default-groups --group test coverage report
      - name: Compute release metrics (coverage % + test count)
        run: uv run --no-default-groups --group test python .github/scripts/ci_compute_metrics.py metrics.json
      - name: Upload release metrics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-metrics
          path: metrics.json
