name: Unit tests (full matrix)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  core:
    name: py${{ matrix.python }} / ${{ matrix.resolution }} / extras-${{ matrix.all_extras }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Core flop-counting is pure Python, so most combos run on ubuntu. But the CPU-freq
        # detection (psutil) and system-info collection (cpuinfo) paths are OS-dependent, and a
        # dependency bump can change their behavior on macOS or Windows -- so one leg on each keeps
        # those paths on the pull-request gate rather than only in the manual benchmark workflows.
        # Combos cover every axis (all four Pythons, both resolution ends, numba on/off, all three
        # OSes) strategically rather than as a full product.
        include:
          - { os: ubuntu-latest,  python: "3.11", resolution: highest,       all_extras: "true"  }
          - { os: ubuntu-latest,  python: "3.12", resolution: highest,       all_extras: "true"  }
          - { os: ubuntu-latest,  python: "3.13", resolution: highest,       all_extras: "true"  }
          - { os: ubuntu-latest,  python: "3.14", resolution: highest,       all_extras: "true"  }
          - { os: ubuntu-latest,  python: "3.11", resolution: lowest-direct, all_extras: "true"  }
          - { os: ubuntu-latest,  python: "3.14", resolution: lowest-direct, all_extras: "true"  }
          - { os: ubuntu-latest,  python: "3.11", resolution: highest,       all_extras: "false" }  # base install: no extras
          - { os: ubuntu-latest,  python: "3.14", resolution: highest,       all_extras: "false" }  # base install: no extras
          - { os: macos-latest,   python: "3.13", resolution: highest,       all_extras: "true"  }  # OS-dependent CPU paths
          - { os: windows-latest, python: "3.13", resolution: highest,       all_extras: "true"  }  # OS-dependent CPU paths
          # Free-threaded build: counting state is per-thread, so this leg is where the
          # concurrency tests can actually fail for the reason they were written -- without the
          # GIL serializing the increments they guard. `highest` resolution is required: the
          # numba floor for 3.14 predates free-threaded wheels (first shipped in numba 0.65),
          # and no PEP 508 marker can raise that floor for free-threaded builds only.
          - { os: ubuntu-latest,  python: "3.14t", resolution: highest,      all_extras: "true"  }
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # full history + tags: hatch-vcs derives the package version via git describe
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/unit_test
        with:
          uv_version: ${{ vars.UV_VERSION }}
          python_version: ${{ matrix.python }}
          dependency_resolution: ${{ matrix.resolution }}
          include_all_extra_deps: ${{ matrix.all_extras }}
          coverage: "true"  # each combo uploads its data; the coverage job unions + gates

  coverage:
    name: coverage
    # Cumulative gate: combine every combo's data into one picture before
    # checking the floor, so version-/dependency-divergent code paths (only hit
    # on some combos) don't read as uncovered.
    needs: [core]
    # always() so a cancelled/failed combo makes this job FAIL explicitly rather
    # than skip — GitHub doesn't reliably propagate a cancelled leg through needs.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every matrix combo to have succeeded
        if: needs.core.result != 'success'
        run: |
          echo "::error::test matrix did not fully succeed (core result: ${{ needs.core.result }})"
          exit 1
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # full history + tags: hatch-vcs derives the package version via git describe
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: ${{ vars.UV_VERSION }}
      - name: Download coverage data from all matrix combos
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-data-*
          merge-multiple: true
      - name: Combine and report (fails below the [tool.coverage.report] floor)
        run: |
          uv run --group dev coverage combine
          uv run --group dev coverage report
      - name: Compute release metrics (coverage % + test count)
        run: uv run --group dev python .github/scripts/ci_compute_metrics.py metrics.json
      - name: Upload release metrics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-metrics
          path: metrics.json
