name: Unit Tests
author: Bert Pluymers
description: Run unit tests at a specific Python version, extras, and dependency resolution.

inputs:
    uv_version:
        required: true
        description: "Version of uv to be used."
    python_version:
        required: false
        description: "Python version. Empty string uses .python-version."
        default: ""
    dependency_resolution:
        required: false
        description: "uv resolution strategy: 'highest' (default) or 'lowest-direct'."
        default: "highest"
    include_all_extra_deps:
        required: false
        description: "'true' (default) installs all optional extras (benchmarking, cli); 'false' installs none."
        default: "true"
    coverage:
        required: false
        description: "'true' runs under coverage and uploads the per-combo data file for a cross-matrix combine; 'false' (default) runs plain pytest."
        default: "false"

runs:
    using: composite
    steps:
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ inputs.uv_version }}
          # Distinct cache key per combo so parallel legs don't race to save one shared key.
          cache-suffix: ${{ inputs.dependency_resolution }}-extras-${{ inputs.include_all_extra_deps }}

      - name: Determine Python version
        shell: bash
        env:
          REQUESTED: ${{ inputs.python_version }}
        run: |  # zizmor: ignore[github-env] value is a workflow-controlled Python version, not user input
          PY="${REQUESTED:-$(cat .python-version)}"
          echo "PYTHON_EFFECTIVE_VERSION=$PY" >> "$GITHUB_ENV"
          echo "Using Python $PY."

      - name: Drop the lockfile so --resolution takes effect
        shell: bash
        run: rm -f uv.lock  # with the tracked lock present, uv reuses its pins and ignores --resolution

      # make needs no setup step on any runner: ubuntu and macOS carry it, and the Windows image
      # provides GNU make on PATH through the mingw64 toolchain that also supplies its gcc.
      - name: Run tests
        shell: bash
        env:
          PY: ${{ env.PYTHON_EFFECTIVE_VERSION }}
          RES: ${{ inputs.dependency_resolution }}
          EXTRAS: ${{ inputs.include_all_extra_deps }}
          COV: ${{ inputs.coverage }}
          # distinct per-combo data file so the coverage job combines rather than overwrites;
          # the runner OS is part of the key because the same python/resolution/extras combo runs
          # on several OSes (ubuntu/macOS/windows), whose data files would otherwise share a name
          # and overwrite each other at combine time -- silently dropping those legs' coverage
          COVERAGE_FILE: .coverage.${{ runner.os }}-${{ inputs.python_version }}-${{ inputs.dependency_resolution }}-${{ inputs.include_all_extra_deps }}
          # The benchmark probes only ever execute compiled, so coverage.py cannot see inside them --
          # numba reports the compiled source lines itself instead. Older numba does not know this
          # variable and ignores it, so the legs pinned to a floor release are unaffected; the legs
          # that do support it are what supply the probe coverage the cumulative gate unions.
          NUMBA_JIT_COVERAGE: "1"
        run: |
          COV_FLAG=""
          # --cov-fail-under=0: the gate is cumulative (coverage job), not per-combo
          [ "$COV" = "true" ] && COV_FLAG="--cov --cov-report= --cov-fail-under=0"
          make test PYTHON="$PY" RESOLUTION="$RES" ALL_EXTRAS="$EXTRAS" PYTEST_ARGS="$COV_FLAG --durations=20"

      - name: Dump collected node-ids (for the cross-combo test-count union)
        if: inputs.coverage == 'true'
        shell: bash
        env:
          PY: ${{ env.PYTHON_EFFECTIVE_VERSION }}
          RES: ${{ inputs.dependency_resolution }}
          EXTRAS: ${{ inputs.include_all_extra_deps }}
        run: |
          # each combo records its own collected set so the coverage job can union them; the
          # `::` filter drops make's own echo of the recipe along with pytest's summary line.
          make test-collect-ids PYTHON="$PY" RESOLUTION="$RES" ALL_EXTRAS="$EXTRAS" \
            | grep '::' > "test-ids-${RUNNER_OS}-${PY}-${RES}-${EXTRAS}.txt"

      - name: Upload coverage + node-id data
        if: inputs.coverage == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-data-${{ runner.os }}-${{ inputs.python_version }}-${{ inputs.dependency_resolution }}-extras-${{ inputs.include_all_extra_deps }}
          path: |
            .coverage.*
            test-ids-*.txt
          include-hidden-files: true  # .coverage.* are dotfiles, excluded by default
          if-no-files-found: error
