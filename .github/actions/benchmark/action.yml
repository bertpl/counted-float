name: Run Benchmarks
author: bertpluymers
description: Run counted_float benchmarks inside a github runner using uv.

inputs:
    uv_version:
        required: true
        description: "Version of UV to be used."
    python_version:
        required: false
        description: "Version of Python to be used.  If omitted will default to version in .python-version"
        default: ""

runs:
    using: "composite"
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          version: ${{ inputs.uv_version }}

      - name: Determine Python version
        shell: bash
        run: |  # zizmor: ignore[github-env] value is a workflow-controlled Python version, not user input
            if [ -n "${INPUTS_PYTHON_VERSION}" ]; then
                echo "PYTHON_EFFECTIVE_VERSION=${INPUTS_PYTHON_VERSION}" >> $GITHUB_ENV
            else
                PYTHON_VERSION=$(cat .python-version)
                echo "PYTHON_EFFECTIVE_VERSION=$PYTHON_VERSION" >> $GITHUB_ENV
            fi
            echo "Using PYTHON ${PYTHON_EFFECTIVE_VERSION}."
        env:
          INPUTS_PYTHON_VERSION: ${{ inputs.python_version }}

      - name: Set up venv, Python ${{ env.PYTHON_EFFECTIVE_VERSION }} & dependencies
        shell: bash
        run:  |
            uv python install ${PYTHON_EFFECTIVE_VERSION}
            uv venv --python ${PYTHON_EFFECTIVE_VERSION}
            uv sync --all-extras --dev

      # Write the full-precision result to a file (the console table is rounded)
      # and upload it so a dispatched run's measurements can be collected.
      - name: Run benchmarks
        shell: bash
        run:  |
            uv run --all-extras --python ${PYTHON_EFFECTIVE_VERSION} counted_float benchmark --output result.json

      - name: Upload benchmark result JSON
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-${{ runner.os }}-${{ runner.arch }}
          path: result.json
          if-no-files-found: error
