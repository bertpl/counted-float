name: Pre-commit
author: Bert Pluymers
description: Set up uv and run the full pre-commit hook suite over all files, via `make lint`.

inputs:
runs:
    using: composite
    steps:
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Cache pre-commit hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          # runner.arch is load-bearing, not decoration: runner.os is `Linux` on both x86 and arm
          # runners, so without it a cache saved on one restores onto the other and the hook
          # binaries fail with an exec format error.
          key: pre-commit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        shell: bash
        # the target owns both the sync and the hook run, so CI cannot drift from `make lint`
        run: make lint PRE_COMMIT_ARGS=--show-diff-on-failure
