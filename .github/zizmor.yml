# zizmor configuration (https://docs.zizmor.sh/configuration/).

rules:
  # The self-repository audit asks for the `$/` form of in-repo references. actionlint rejects that form
  # (rhysd/actionlint#711), so the workspace-relative `./` form stays until actionlint accepts `$/`.
  self-repository:
    ignore:
      - _unit_tests.yml
      - pull_request.yml
      - push_to_branch.yml
      - push_to_main.yml
      - release_tag.yml
      - benchmark_linux_arm.yml
      - benchmark_linux_x86.yml
      - benchmark_macos_arm.yml
      - benchmark_macos_x86.yml
      - benchmark_windows_x86.yml
